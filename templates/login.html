
{% extends "base.html" %}
{% block title %}Login | Civic Connect{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to access your account.</p>
    <form method="post">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">

        <button class="btn full" type="submit">Login</button>
    </form>
    <p>New to Civic Connect? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
</section>
{% endblock %}
